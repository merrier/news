<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="综合热点新闻聚合站，定时汇总国内、财经、科技和国际热点。">
    <title>News | 综合热榜</title>
    <link rel="stylesheet" href="./assets/styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Live Hotlist</p>
          <h1>News</h1>
        </div>
        <div class="status">
          <span id="updatedAt">正在读取</span>
          <button id="refreshButton" class="icon-button" type="button" aria-label="刷新数据" title="刷新数据">
            <span aria-hidden="true">↻</span>
          </button>
        </div>
      </header>

      <section class="toolbar" aria-label="筛选工具">
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索标题、来源或摘要">
        </label>
        <div id="categoryTabs" class="tabs" role="tablist" aria-label="新闻分类"></div>
      </section>

      <main class="layout">
        <aside class="sources-panel" aria-label="新闻源">
          <div class="panel-heading">
            <span>来源</span>
            <strong id="sourceCount">0</strong>
          </div>
          <div id="sourceList" class="source-list"></div>
        </aside>

        <section class="feed" aria-label="新闻列表">
          <div class="feed-head">
            <div>
              <p class="eyebrow">Headlines</p>
              <h2 id="feedTitle">全部热点</h2>
            </div>
            <div class="metrics">
              <span id="itemCount">0 条</span>
              <span id="errorCount" hidden>0 个源失败</span>
            </div>
          </div>
          <div id="newsList" class="news-list"></div>
          <p id="emptyState" class="empty" hidden>没有匹配的新闻。</p>
        </section>
      </main>

      <footer class="footer">
        <span>Inspired by <a href="https://github.com/ourongxing/newsnow" target="_blank" rel="noreferrer">ourongxing/newsnow</a></span>
        <span>内容归原站点所有</span>
      </footer>
    </div>

    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
